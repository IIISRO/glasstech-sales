upstream hello_django {
    server web:8000;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=django_cache:100m inactive=60m use_temp_path=off;

server {
    listen 80;

    # STATIC FILES
    location /static/ {
        alias /code/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # MEDIA FILES
    location /media/ {
        alias /code/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_cache django_cache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $cookie_sessionid $cookie_csrftoken;
        proxy_no_cache $request_method = POST;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://hello_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}